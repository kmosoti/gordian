[package]
name = "gordian-run"
version = "0.1.0"
description = "Run harness, recorder and driver binary: executes one manifest of episodes under a policy and records every outcome"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gordian-run"
path = "src/main.rs"

[dependencies]
# Requirement: Bill, Budget, Charge, Ledger, ManualClock, Instant, the accounting vocabulary the
# harness charges and records in.
# Simpler alternative: none; the harness exists to drive these.
gordian-core = { path = "../gordian-core" }
# Requirement: EpisodeSpec, generate, Simulator, Action, Outcome, ComponentDirective. Default
# features only: the hidden-state accessor is not enabled on this crate's account (the evaluator
# enables it for the build, which cargo unifies; scripts/check-no-oracle.sh is the textual guard).
# Simpler alternative: none.
gordian-world = { path = "../gordian-world" }
# Requirement: `score` and `Truth`. The harness builds Truth from the generated episode and
# scores the trajectory; it never reads hidden state itself.
# Simpler alternative: none; a second scorer would be a second evaluator.
gordian-eval = { path = "../gordian-eval" }
# Requirement: the Component trait, WorkingState and the four fixed components that a run
# drives, and the hypothesis payload decoder.
# Simpler alternative: none.
gordian-components = { path = "../gordian-components" }
# Requirement (work item R3): the stream world the stream harness plays: `generate`,
# `StreamSimulator`, the actions and events, and `StreamPublic`, the only thing an arm may know
# about it. Default features only: the hidden-state accessor is switched on by
# `gordian-stream-eval`, not by this manifest.
# Simpler alternative: none; the stream harness exists to drive this world.
gordian-stream = { path = "../gordian-stream" }
# Requirement (work item R3b): the stream evaluator: `score_stream`, which scores each segment, and
# `truth_from_stream` and `calls_from_sim`, the two calls that read the stream's hidden state for
# it. The crate carries the stream's hidden-state feature, as `gordian-eval` carries the first
# world's, because this manifest may not (a test and `scripts/check-no-oracle.sh` check that it
# does not). It replaces R3's accessor shim crate, which existed only until the evaluator
# could be wired in.
# Simpler alternative: a second scorer, which would be a second evaluator, or enabling the feature
# here, which both guards forbid.
gordian-stream-eval = { path = "../gordian-stream-eval" }
# Requirement (work item M2): the medium as a noticer on the stream world. The arm in
# `src/stream/arms/medium/` builds a `Medium` from a hand-designed spec, feeds it public
# observations through its sense and clock ports, and turns its proposals into notices.
# Simpler alternative: a noticer written directly in this crate; rejected, the experiment is a
# test of the medium itself, so the arm must run the medium's own tick, archetypes and counts.
# Cost: a path dependency on a crate already in the workspace that depends only on
# `gordian-core` and `serde`; nothing new in Cargo.lock.
gordian-medium = { path = "../gordian-medium" }
# Requirement: the `random_matched` arm draws from a seeded, reproducible ChaCha8 stream (plan
# section 4 permits rand_chacha for this). The same crate and version the world already uses, so
# it adds nothing to the lockfile.
# Simpler alternative: a hand-rolled generator; possible, but gains nothing over a vetted one.
rand_chacha = "0.10.0"
# Requirement: the `Rng` and `SeedableRng` traits that rand_chacha's generator implements.
# Simpler alternative: none; rand_chacha cannot be used without it.
rand_core = "0.10.1"
# Requirement: the manifest is read and written as JSON, and the events sample is JSON lines,
# for the analysis package and for review.
# Simpler alternative: hand-written JSON; rejected because the manifest schema will grow.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
