[package]
name = "gordian-stream-reveal"
version = "0.1.0"
description = "The privileged accessor for hidden stream state: the one crate besides the stream evaluator that enables the stream's reveal-hidden-state feature"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Requirement: `StreamTruth` and the reasoner's call records, which exist only under the stream's
# `reveal-hidden-state` feature. This crate is where the feature is switched on for the stream
# harness (`gordian-run`), the way `gordian-eval` switches on the first world's: `gordian-run`'s own
# manifest must not mention the feature (a test and `scripts/check-no-oracle.sh` check that), so a
# dependency has to carry it. Only the stream evaluator and this crate may enable the feature.
# Simpler alternative: enable it in `gordian-run`'s manifest, which fails the two guards above and
# would put the feature one line from policy code. Cost: one crate of about 40 lines. When the
# stream evaluator (R2) is wired into `gordian-run` it carries the feature too, and this crate can
# stay as the single accessor or be deleted; nothing here is policy.
gordian-stream = { path = "../gordian-stream", features = ["reveal-hidden-state"] }

[lints]
workspace = true
