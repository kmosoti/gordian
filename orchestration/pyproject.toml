[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gordian-orchestration"
version = "0.1.0"
description = "Thin experiment and process orchestration for the Rust Gordian substrate"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = []

[project.scripts]
gordian-project-sync = "gordian_orchestration.github_project:main"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
