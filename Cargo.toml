[workspace]
members = ["crates/gordian-kg"]
exclude = [
    "formal/_lean4export",
    "formal/_nanoda_lib",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/kmosoti/gordian"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
