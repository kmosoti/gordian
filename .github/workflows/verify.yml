name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust substrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Validate research graph
        run: cargo run -p gordian-kg -- validate

  formal:
    name: Formal models and proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build, independently check proofs, and audit axioms
        uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: formal
          auto-config: false
          use-github-cache: false
          build: true
          test: false
          lint: false
          leanchecker: true
          nanoda: false
          axiom-audit: true

  python:
    name: Thin Python orchestration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install package and pinned linter
        run: python -m pip install --disable-pip-version-check -e ./orchestration ruff==0.16.5

      - name: Lint
        run: ruff check orchestration

      - name: Compile
        run: python -m compileall -q orchestration/src

      - name: Test
        run: python -m unittest discover -s orchestration/tests
