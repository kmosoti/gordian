name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust substrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Validate research graph
        run: cargo run -p gordian-kg -- validate

  lean:
    name: Formal models and proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, independently check proofs, and audit axioms
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          use-github-cache: false
          build: true
          test: false
          lint: false
          nanoda: true
          nanoda-allow-sorry: false
          axiom-audit: true
