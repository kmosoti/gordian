name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jj-baseline:
    name: Jujutsu baseline contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # This job intentionally starts without actions/checkout.  It executes the two
      # acquisition blocks from docs/implementation/agent-runbook.md on a clean runner.
      # `cargo install jj-cli` compiles Jujutsu from source and ran in three jobs:
      # 261s + 253s + 199s of a 1496s pipeline. The binary depends only on the pin in
      # scripts/bootstrap-jj.sh, so it is cached on that version and rebuilt only when the
      # pin moves. bootstrap-jj.sh still verifies the version it finds, so a stale or
      # wrong-version cache entry fails the run rather than silently passing.
      - name: Cache Jujutsu binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/jj
          key: jj-${{ runner.os }}-${{ hashFiles('scripts/bootstrap-jj.sh') }}
      - name: Install acquisition prerequisites
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --no-modify-path
          . "$HOME/.cargo/env"
          # A restored cache already put `jj` in ~/.cargo/bin, and `cargo install`
          # refuses to overwrite an existing binary ("binary `jj` already exists in
          # destination", exit 101). This step only needs *a* jj to clone with; the
          # pin is enforced by bootstrap-jj.sh --install after the clone, which does
          # pass --force. So skip the build when the cache supplied one.
          if command -v jj >/dev/null 2>&1; then
            echo "jj from cache: $(jj --version); bootstrap-jj.sh enforces the pin after clone"
          else
            cargo install --locked --bin jj jj-cli
          fi

      - name: Acquire repository and pinned Jujutsu
        env:
          GORDIAN_ROOT: ${{ runner.temp }}/gordian
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          jj git clone https://github.com/kmosoti/gordian "${GORDIAN_ROOT:-$HOME/gordian}"
          cd "${GORDIAN_ROOT:-$HOME/gordian}"
          bash scripts/bootstrap-jj.sh --install
          git --git-dir "$(jj git root)" fetch origin "$GITHUB_SHA"
          jj git import
          jj new "$GITHUB_SHA"

      - name: Verify acquired source frontier
        env:
          GORDIAN_ROOT: ${{ runner.temp }}/gordian
        run: |
          set -euo pipefail
          cd "${GORDIAN_ROOT:-$HOME/gordian}"
          test "$(jj log -r '@-' --no-graph -T 'commit_id')" = "$GITHUB_SHA"
          jj log -r 'trunk()' -n 1

      - name: Run Jujutsu contract suite
        env:
          GORDIAN_ROOT: ${{ runner.temp }}/gordian
        run: |
          set -euo pipefail
          cd "${GORDIAN_ROOT:-$HOME/gordian}"
          bash experiments/jj-baseline/contract.sh

  rust:
    name: Rust substrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # rust-toolchain.toml is the single authoritative pin: this action reads the channel
      # and components from it, so no Rust version literal appears in this workflow.
      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      # 115s to compile a tool whose version lives in one file.
      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ hashFiles('.cargo-deny-version') }}
      - name: Install pinned cargo-deny
        run: |
          set -euo pipefail
          want="$(cat .cargo-deny-version)"
          # A cache hit must still satisfy the pin; never trust the restored binary blindly.
          if [ -x "$HOME/.cargo/bin/cargo-deny" ] \
             && cargo-deny --version 2>/dev/null | grep -qF "$want"; then
            echo "cargo-deny $want restored from cache"
          else
            cargo install cargo-deny --locked --version "$want"
          fi

      - name: Run Rust and supply-chain verification
        run: scripts/verify-local.sh rust

  formal:
    name: Formal models and proofs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        env:
          LEAN_NUM_THREADS: "1"
        with:
          lake-package-directory: formal
          auto-config: false
          use-github-cache: false
          build: false
          test: false
          lint: false
          leanchecker: false
          nanoda: false
          axiom-audit: false

      - name: Cache Lean toolchain and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            formal/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}
          restore-keys: lean-${{ runner.os }}-

      - name: Build, replay-check proofs, and audit axioms
        run: scripts/verify-local.sh formal

      - name: Write exact-revision formal evidence
        run: scripts/write-formal-evidence.sh "$GITHUB_SHA" "$RUNNER_TEMP/formal-evidence.json"

      - name: Publish exact-revision formal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formal-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/formal-evidence.json
          if-no-files-found: error

  python:
    name: Thin Python orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install package and pinned linter
        run: python -m pip install --disable-pip-version-check -e './orchestration[dev]'

      # derive_status resolves immutable subjects through Jujutsu, so its tests need a
      # real JJ repository and an actor identity. actions/checkout produces a git
      # checkout with neither, which is why these tests passed locally and failed here.
      # `cargo install jj-cli` compiles Jujutsu from source and ran in three jobs:
      # 261s + 253s + 199s of a 1496s pipeline. The binary depends only on the pin in
      # scripts/bootstrap-jj.sh, so it is cached on that version and rebuilt only when the
      # pin moves. bootstrap-jj.sh still verifies the version it finds, so a stale or
      # wrong-version cache entry fails the run rather than silently passing.
      - name: Cache Jujutsu binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/jj
          key: jj-${{ runner.os }}-${{ hashFiles('scripts/bootstrap-jj.sh') }}
      - name: Bootstrap Jujutsu
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Configure Jujutsu
        run: |
          set -euo pipefail
          bash scripts/bootstrap-jj.sh --install-only
          jj git init --colocate
          # --user, not --repo. The checker tests create their own JJ repositories in
          # temp fixtures (`jj git init --colocate`), and a --repo identity does not
          # reach those. Locally this is masked by a developer's own user-level identity,
          # which is exactly why these two suites passed here and failed in CI.
          jj config set --user user.name "gordian-agent/ci/unattended"
          jj config set --user user.email "agents@gordian.invalid"

      - name: Run Python verification
        run: scripts/verify-local.sh python

  spec-consistency:
    name: Specification consistency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: scripts/check-actor-identity.sh reads the commit range under review to
      # validate the Gordian-Actor trailer (G-511). With the default shallow clone there is no
      # range, and the checker would report an empty subject on every run.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Closure validation resolves immutable subjects through JJ. Install and configure it
      # from the single pinned bootstrap source; no JJ release literal belongs in this workflow.
      # `cargo install jj-cli` compiles Jujutsu from source and ran in three jobs:
      # 261s + 253s + 199s of a 1496s pipeline. The binary depends only on the pin in
      # scripts/bootstrap-jj.sh, so it is cached on that version and rebuilt only when the
      # pin moves. bootstrap-jj.sh still verifies the version it finds, so a stale or
      # wrong-version cache entry fails the run rather than silently passing.
      - name: Cache Jujutsu binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/jj
          key: jj-${{ runner.os }}-${{ hashFiles('scripts/bootstrap-jj.sh') }}
      - name: Bootstrap Jujutsu
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - name: Configure Jujutsu
        run: |
          set -euo pipefail
          bash scripts/bootstrap-jj.sh --install-only
          jj git init --colocate
          # --user, not --repo. The checker tests create their own JJ repositories in
          # temp fixtures (`jj git init --colocate`), and a --repo identity does not
          # reach those. Locally this is masked by a developer's own user-level identity,
          # which is exactly why these two suites passed here and failed in CI.
          jj config set --user user.name "gordian-agent/ci/unattended"
          jj config set --user user.email "agents@gordian.invalid"
          bash scripts/bootstrap-jj.sh

      - name: Run specification-consistency verification
        run: scripts/verify-local.sh spec-consistency
